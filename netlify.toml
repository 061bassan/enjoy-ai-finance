# Plano B de hospedagem — o deploy de verdade é na Vercel, ligada ao repositório.
#
# Este arquivo fica para o caso de uma troca de serviço: guarda a única
# configuração que não é óbvia (o fallback de SPA) já resolvida.
#
# O ponto crítico é o fallback de SPA: o app é single-page com rotas no cliente
# (React Router). Sem redirecionar tudo para index.html, qualquer acesso direto
# ou reload numa rota interna (/vendas, /dashboard) dá 404 no servidor.
# O arquivo public/_redirects faz a mesma coisa e é copiado para o dist; este
# bloco é o espelho declarativo e serve de documentação.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
